[package]
name = "wisp"
description = "Wisp, a fast Minecraft launcher with cloud sync"
version.workspace = true
edition.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Already built for TLS; tester updates (tester_updates.rs) use its AES-GCM and HKDF. Same
# features, so nothing new compiles.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.22"
# Pictures given to the skin maker (decoded here, read by wisp-core).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
# The release config (with the updater's settings) makes generate_context! embed JSON.
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["sync", "macros", "time"] }
trash = "5"
wisp-core = { path = "../crates/wisp-core" }

[features]
# playit.gg's agent inside Wisp, for a public address per server (tester builds; see
# wisp-core's Cargo.toml). Public builds leave it out.
playit = ["wisp-core/playit"]
