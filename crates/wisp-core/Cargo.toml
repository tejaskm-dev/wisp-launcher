[package]
name = "wisp-core"
description = "Wisp's launcher logic, kept independent of the UI"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
base64 = "0.22"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
futures-core = "0.3"
md-5 = "0.11.0"
nostr-sdk = { version = "0.45", default-features = false, features = ["aws_lc_rs", "rustls-tls-webpki-roots"] }
# Gift wraps (NIP-59) hide who's talking to whom; NIP-44 encrypts them.
nostr = { version = "0.45", features = ["std", "nip44", "nip59", "os-rng"] }
# Both TLS crypto backends end up compiled in (reqwest and the relay websockets differ), so the
# relay connection picks aws-lc-rs explicitly.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "rt", "sync", "time", "macros"] }
whoami = "2"
zip = { version = "9.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
regex = "1"
toml = "1"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
# Minecraft checks skin signatures as SHA1withRSA, which aws-lc-rs won't sign: the skin server
# (skin_server.rs) signs with these, on the digest 0.10 generation of SHA-1 that rsa 0.9 takes.
rsa = { version = "0.9", features = ["sha1"] }
sha1_10 = { package = "sha1", version = "0.10", features = ["oid"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# The skin key tester builds share, made the same way from their build secret (skin_server::shared_key).
rand_chacha = "0.3"
# The link between friends' Wisps (tunnel/): QUIC over a hole-punched UDP socket, each side's
# self-made certificate pinned by its SHA-256, and the router asked to let it through (UPnP).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.10"
# The same link through a server's door (tunnel/door.rs), as TLS over TCP.
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }

# playit.gg's own agent (BSD-2-Clause), for a public address per hosted server without installing
# anything. Only tester builds carry it (feature "playit"), until playit agrees in writing to Wisp
# bundling it (their terms 3.4); public builds guide players through playit's own app instead.
playit-agent-core = { git = "https://github.com/playit-cloud/playit-agent", tag = "v2.0.2", optional = true }
playit-api-client = { git = "https://github.com/playit-cloud/playit-agent", tag = "v2.0.2", optional = true }
tokio-util = { version = "0.7", optional = true }

[features]
playit = ["dep:playit-agent-core", "dep:playit-api-client", "dep:tokio-util"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "playit_check"
required-features = ["playit"]
