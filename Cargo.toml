[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.8"
edition = "2024"

# Small, fast release binaries: whole-program optimisation, no unwinding tables, no symbols.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
