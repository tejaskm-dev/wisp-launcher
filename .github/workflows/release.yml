name: Release

# Pushing a tag like v0.1.5 builds Wisp for every system and attaches the installers to a GitHub
# release: a draft while the builds run, published as a pre-release once all of them pass. The
# notes come from .github/release-notes.md.
#
# Run it by hand (Actions > Release > Run workflow) to build without releasing; the installers are
# kept as workflow artifacts. Name some builds to make only those, so trying a fix for one system
# doesn't pay for all six again (macOS minutes count ten times on private repositories).
#
# Tick "tester" for a tester build: offline accounts on (for a closed group who own Minecraft,
# until Microsoft sign-in is approved), and never released. Its installers are kept as artifacts
# for one day only, for a first install (the repository is public, so anyone signed in to GitHub
# could download them). After that, tester builds update themselves from a feed of their own
# (tester.json, beside latest.json), never the public one (which would take offline accounts away
# again). The feed's files are locked with a tester code that only tester builds hold (and show,
# so their owner can invite people; pasting it into any other copy of Wisp switches that copy to
# tester builds); see scripts/tester-updates.mjs. Each tester build is numbered by its run, as in
# 0.1.8+145.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      builds:
        description: "Builds to make, separated by spaces (blank for all): macos-arm64 macos-x64 windows-x64 windows-arm64 linux-x64 linux-arm64"
        required: false
        default: ""
      tester:
        description: "Tester build: offline accounts on, never released, updates installed tester builds. Only for people who own Minecraft."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the builds
        id: pick
        shell: bash
        env:
          ONLY: ${{ github.event.inputs.builds }}
        run: |
          all='[
            {"name": "macos-arm64", "os": "macos-latest", "target": "aarch64-apple-darwin", "args": "--target aarch64-apple-darwin"},
            {"name": "macos-x64", "os": "macos-latest", "target": "x86_64-apple-darwin", "args": "--target x86_64-apple-darwin"},
            {"name": "windows-x64", "os": "windows-latest", "target": "x86_64-pc-windows-msvc", "args": "--target x86_64-pc-windows-msvc"},
            {"name": "windows-arm64", "os": "windows-latest", "target": "aarch64-pc-windows-msvc", "args": "--target aarch64-pc-windows-msvc --bundles nsis"},
            {"name": "linux-x64", "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "args": "--target x86_64-unknown-linux-gnu"},
            {"name": "linux-arm64", "os": "ubuntu-22.04-arm", "target": "aarch64-unknown-linux-gnu", "args": "--target aarch64-unknown-linux-gnu"}
          ]'
          picked=$(jq -c --arg only "$ONLY" '[.[] | . as $build | select($only == "" or ($only | split(" ") | any(. == $build.name)))]' <<< "$all")
          if [ "$picked" = "[]" ]; then
            echo "No build is called any of: $ONLY" >&2
            exit 1
          fi
          echo "matrix={\"include\":$picked}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # The TLS library (aws-lc) assembles its x86 code with NASM on Windows.
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Release notes
        id: notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          {
            echo 'body<<WISP_RELEASE_NOTES'
            cat .github/release-notes.md
            echo 'WISP_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      # Self-updating builds: once the repository has the variables WISP_UPDATER_PUBKEY (the public
      # half of the key from `pnpm tauri signer generate`) and WISP_UPDATES_URL (where latest.json
      # will be, publicly reachable), plus the secrets TAURI_SIGNING_PRIVATE_KEY and
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD, builds are signed and the release gets a latest.json
      # that installed copies check. Without them, builds are made as before and don't update.
      - name: Turn on updates
        if: vars.WISP_UPDATER_PUBKEY != '' && vars.WISP_UPDATES_URL != ''
        shell: bash
        env:
          PUBKEY: ${{ vars.WISP_UPDATER_PUBKEY }}
          URL: ${{ vars.WISP_UPDATES_URL }}
          TESTER: ${{ inputs.tester && '1' || '' }}
          RUN: ${{ github.run_number }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Pasted values often carry a trailing newline, which would break the JSON.
          PUBKEY=$(printf '%s' "$PUBKEY" | tr -d '[:space:]')
          URL=$(printf '%s' "$URL" | tr -d '[:space:]')
          if [ "$TESTER" = "1" ]; then
            # A tester build: numbered by this run, looking at the tester feed, and holding the
            # tester code its updates are locked with (masked: the logs are public).
            VERSION="$(node -p "require('./package.json').version")+$RUN"
            CODE=$(node scripts/tester-updates.mjs code)
            echo "::add-mask::$CODE"
            echo "WISP_TESTER_CODE=$CODE" >> "$GITHUB_ENV"
            # The skin key every tester build signs with and trusts (masked too).
            SEED=$(node scripts/tester-updates.mjs skin-seed)
            echo "::add-mask::$SEED"
            echo "WISP_SKIN_SEED=$SEED" >> "$GITHUB_ENV"
            echo "VITE_WISP_TESTER_BUILD=$RUN" >> "$GITHUB_ENV"
            printf '{"version":"%s","bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["%s"]}}}' "$VERSION" "$PUBKEY" "${URL%/*}/tester.json" > src-tauri/tauri.updates.conf.json
          else
            printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["%s"]}}}' "$PUBKEY" "$URL" > src-tauri/tauri.updates.conf.json
          fi

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tester builds only (an empty value leaves both off).
          WISP_TESTER: ${{ inputs.tester && '1' || '' }}
          VITE_WISP_TESTER: ${{ inputs.tester && '1' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          # Tester builds carry playit's agent (a public address per server with nothing to
          # install); public builds don't until playit agrees in writing (their terms 3.4).
          args: ${{ matrix.args }}${{ inputs.tester && ' --features playit' || '' }}${{ vars.WISP_UPDATER_PUBKEY != '' && vars.WISP_UPDATES_URL != '' && ' --config src-tauri/tauri.updates.conf.json' || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Wisp {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: ${{ vars.WISP_UPDATER_PUBKEY != '' && vars.WISP_UPDATES_URL != '' && !inputs.tester }}

      - name: Keep the installers
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: wisp-${{ matrix.name }}${{ inputs.tester && '-tester' || '' }}
          if-no-files-found: error
          # Tester installers for a day (new testers join with a tester code instead); others for
          # the repository's default (0).
          retention-days: ${{ inputs.tester && 1 || 0 }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm

      # Tester builds: this system's signed update files, locked for the tester feed (which the
      # tester-feed job publishes once every build has passed).
      - name: Lock the tester update
        if: inputs.tester && vars.WISP_UPDATER_PUBKEY != '' && vars.WISP_UPDATES_URL != ''
        shell: bash
        run: node scripts/tester-updates.mjs pack "target/${{ matrix.target }}/release/bundle" tester-update "${{ matrix.name }}" "${{ github.run_number }}"

      - name: Keep the tester update for the feed
        if: inputs.tester && vars.WISP_UPDATER_PUBKEY != '' && vars.WISP_UPDATES_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: tester-update-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1
          path: tester-update/

  # Installed tester builds look in releases/download/updater/tester.json. Only locked files go
  # there; the previous tester build's files are removed once the new feed is up. Only a run that
  # built every system replaces the feed, so no tester is left without an update for theirs.
  tester-feed:
    name: Publish the tester update
    needs: build
    if: inputs.tester && inputs.builds == '' && vars.WISP_UPDATER_PUBKEY != '' && vars.WISP_UPDATES_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40

      - uses: actions/download-artifact@v4
        with:
          pattern: tester-update-*
          path: tester-update
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ vars.WISP_UPDATES_URL }}
          RUN: ${{ github.run_number }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          URL=$(printf '%s' "$URL" | tr -d '[:space:]')
          # The feed carries a check on the tester code (never the code), for codes pasted into Wisp.
          WISP_TESTER_CODE=$(node scripts/tester-updates.mjs code)
          echo "::add-mask::$WISP_TESTER_CODE"
          export WISP_TESTER_CODE
          VERSION="$(node -p "require('./package.json').version")+$RUN"
          { echo "### What's new"; echo; git log --no-merges --format='- %s' -n 6; } > tester-notes.md
          node scripts/tester-updates.mjs feed tester-update "$VERSION" "${URL%/*}" tester-notes.md > tester.json
          # The files first, then the feed that points at them, then the old files.
          gh release upload updater tester-update/*.bin --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload updater tester.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release view updater --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[].name | select(startswith(\"tester-\") and (startswith(\"tester-$RUN-\") | not))" \
            | while read -r old; do gh release delete-asset updater "$old" --repo "$GITHUB_REPOSITORY" --yes; done

  publish:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      # Installed copies of Wisp look for new versions in one fixed place (WISP_UPDATES_URL):
      # releases/download/updater/latest.json. Each release copies its latest.json there, pre-
      # releases included (GitHub's "latest release" link skips those).
      - name: Point installed copies at this release
        if: vars.WISP_UPDATER_PUBKEY != '' && vars.WISP_UPDATES_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir updater
          if ! gh release view updater --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create updater --repo "$GITHUB_REPOSITORY" --prerelease --title "Wisp updates" \
              --notes "Where installed copies of Wisp look for new versions. Nothing to download here: get Wisp from the newest release."
          fi
          gh release upload updater updater/latest.json --repo "$GITHUB_REPOSITORY" --clobber
