name: Release

# Pushing a tag like v0.1.5 builds Wisp for every system and attaches the installers to a GitHub
# release: a draft while the builds run, published as a pre-release once all of them pass. The
# notes come from .github/release-notes.md.
#
# Run it by hand (Actions > Release > Run workflow) to build without releasing; the installers are
# kept as workflow artifacts. Name some builds to make only those, so trying a fix for one system
# doesn't pay for all six again (macOS minutes count ten times on private repositories).
#
# Tick "tester" for a tester build: offline accounts on (for a closed group who own Minecraft,
# until Microsoft sign-in is approved), no self-updating (a public release would take offline
# accounts away again), and never released.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      builds:
        description: "Builds to make, separated by spaces (blank for all): macos-arm64 macos-x64 windows-x64 windows-arm64 linux-x64 linux-arm64"
        required: false
        default: ""
      tester:
        description: "Tester build: offline accounts on, no self-updating, never released. Only for people who own Minecraft."
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Pick the builds
        id: pick
        shell: bash
        env:
          ONLY: ${{ github.event.inputs.builds }}
        run: |
          all='[
            {"name": "macos-arm64", "os": "macos-latest", "target": "aarch64-apple-darwin", "args": "--target aarch64-apple-darwin"},
            {"name": "macos-x64", "os": "macos-latest", "target": "x86_64-apple-darwin", "args": "--target x86_64-apple-darwin"},
            {"name": "windows-x64", "os": "windows-latest", "target": "x86_64-pc-windows-msvc", "args": "--target x86_64-pc-windows-msvc"},
            {"name": "windows-arm64", "os": "windows-latest", "target": "aarch64-pc-windows-msvc", "args": "--target aarch64-pc-windows-msvc --bundles nsis"},
            {"name": "linux-x64", "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "args": "--target x86_64-unknown-linux-gnu"},
            {"name": "linux-arm64", "os": "ubuntu-22.04-arm", "target": "aarch64-unknown-linux-gnu", "args": "--target aarch64-unknown-linux-gnu"}
          ]'
          picked=$(jq -c --arg only "$ONLY" '[.[] | . as $build | select($only == "" or ($only | split(" ") | any(. == $build.name)))]' <<< "$all")
          if [ "$picked" = "[]" ]; then
            echo "No build is called any of: $ONLY" >&2
            exit 1
          fi
          echo "matrix={\"include\":$picked}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # The TLS library (aws-lc) assembles its x86 code with NASM on Windows.
      - name: NASM
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Release notes
        id: notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          {
            echo 'body<<WISP_RELEASE_NOTES'
            cat .github/release-notes.md
            echo 'WISP_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      # Self-updating builds: once the repository has the variables WISP_UPDATER_PUBKEY (the public
      # half of the key from `pnpm tauri signer generate`) and WISP_UPDATES_URL (where latest.json
      # will be, publicly reachable), plus the secrets TAURI_SIGNING_PRIVATE_KEY and
      # TAURI_SIGNING_PRIVATE_KEY_PASSWORD, builds are signed and the release gets a latest.json
      # that installed copies check. Without them, builds are made as before and don't update.
      - name: Turn on updates
        if: vars.WISP_UPDATER_PUBKEY != '' && vars.WISP_UPDATES_URL != '' && !inputs.tester
        shell: bash
        env:
          PUBKEY: ${{ vars.WISP_UPDATER_PUBKEY }}
          URL: ${{ vars.WISP_UPDATES_URL }}
        run: |
          # Pasted values often carry a trailing newline, which would break the JSON.
          PUBKEY=$(printf '%s' "$PUBKEY" | tr -d '[:space:]')
          URL=$(printf '%s' "$URL" | tr -d '[:space:]')
          printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s","endpoints":["%s"]}}}' "$PUBKEY" "$URL" > src-tauri/tauri.updates.conf.json

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tester builds only (an empty value leaves both off).
          WISP_TESTER: ${{ inputs.tester && '1' || '' }}
          VITE_WISP_TESTER: ${{ inputs.tester && '1' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}${{ vars.WISP_UPDATER_PUBKEY != '' && vars.WISP_UPDATES_URL != '' && !inputs.tester && ' --config src-tauri/tauri.updates.conf.json' || '' }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Wisp {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: ${{ vars.WISP_UPDATER_PUBKEY != '' && vars.WISP_UPDATES_URL != '' && !inputs.tester }}

      - name: Keep the installers
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: wisp-${{ matrix.name }}${{ inputs.tester && '-tester' || '' }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm

  publish:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      # Installed copies of Wisp look for new versions in one fixed place (WISP_UPDATES_URL):
      # releases/download/updater/latest.json. Each release copies its latest.json there, pre-
      # releases included (GitHub's "latest release" link skips those).
      - name: Point installed copies at this release
        if: vars.WISP_UPDATER_PUBKEY != '' && vars.WISP_UPDATES_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir updater
          if ! gh release view updater --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create updater --repo "$GITHUB_REPOSITORY" --prerelease --title "Wisp updates" \
              --notes "Where installed copies of Wisp look for new versions. Nothing to download here: get Wisp from the newest release."
          fi
          gh release upload updater updater/latest.json --repo "$GITHUB_REPOSITORY" --clobber
